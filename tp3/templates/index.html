<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChefBot — Assistant Culinaire</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">🍳</div>
        <div class="logo-text">
          <h1>ChefBot</h1>
          <p>Assistant Culinaire</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="badge">🌿 Cuisine IA</span>
        <button id="reset-btn" onclick="resetChat()">
          <span>↺</span> Nouvelle conversation
        </button>
      </div>
    </header>

    <div id="chat-container">
      <div class="welcome-card" id="welcome-card">
        <div class="welcome-icon">👨‍🍳</div>
        <h2>Bonjour, je suis ChefBot !</h2>
        <p>
          Posez-moi toutes vos questions sur la cuisine — recettes, techniques,
          ingrédients, conseils… Je suis là pour vous aider à cuisiner avec
          passion.
        </p>
        <div class="suggestion-chips">
          <button
            class="chip"
            onclick="sendSuggestion('Donne-moi une recette de tajine poulet')"
          >
            🥘 Tajine poulet
          </button>
          <button
            class="chip"
            onclick="sendSuggestion('Comment faire une sauce béchamel ?')"
          >
            🥛 Sauce béchamel
          </button>
          <button
            class="chip"
            onclick="sendSuggestion('Recette de makroud maison')"
          >
            🍯 Makroud
          </button>
          <button
            class="chip"
            onclick="sendSuggestion('Idées de repas rapides en 20 minutes')"
          >
            ⚡ Repas rapide
          </button>
          <button
            class="chip"
            onclick="sendSuggestion('Comment réussir une pâte feuilletée ?')"
          >
            🥐 Pâte feuilletée
          </button>
          <button
            class="chip"
            onclick="sendSuggestion('Recette de couscous tunisien')"
          >
            🍲 Couscous
          </button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Demandez une recette, un conseil culinaire…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <p class="input-hint">
        Entrée pour envoyer · Maj+Entrée pour sauter une ligne
      </p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
